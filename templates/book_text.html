{% extends 'base.html' %}

{% block content %}
{{ super() }}

    <a href="/books/" type="submit" class="btn btn-warning m-1">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-chevron-compact-left" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M9.224 1.553a.5.5 0 0 1 .223.67L6.56 8l2.888 5.776a.5.5 0 1 1-.894.448l-3-6a.5.5 0 0 1 0-.448l3-6a.5.5 0 0 1 .67-.223"/>
    </svg>
    </a>

    <a href="/books/author/{{ author.id }}" type="submit" class="btn btn-warning m-1">
    <h1>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-chevron-compact-left" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M9.224 1.553a.5.5 0 0 1 .223.67L6.56 8l2.888 5.776a.5.5 0 1 1-.894.448l-3-6a.5.5 0 0 1 0-.448l3-6a.5.5 0 0 1 .67-.223"/>
    </svg>{{ author.author }}
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-bookmark-check" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M10.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0"/>
          <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z"/>
           </svg>
        </h1><br>
    </a><br>
<img class="rounded-3 m-2" src="/static/imgbooks/authors/{{ author.id }}.jpg"  alt="{{ author.author }}"
          style="height: 150px;"><br>
    <h4>
    Отрывок из произведения:<br>
    <a href="/books/book/{{ author.id }}/{{ book.id }}?page={{ page }}" type="submit" class="btn btn-warning m-1 fs-2">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-chevron-compact-left" viewBox="0 0 16 16">
    <path fill-rule="evenodd" d="M9.224 1.553a.5.5 0 0 1 .223.67L6.56 8l2.888 5.776a.5.5 0 1 1-.894.448l-3-6a.5.5 0 0 1 0-.448l3-6a.5.5 0 0 1 .67-.223"/>
    </svg>
        {{ book.bookru }} / {{ book.book }}
    </a>
    <a href="/books/level/{{ book.level }}" type="submit" class="btn btn-warning m-1 fs-3">
    {{ book.level }}
    </a>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-book-half" viewBox="0 0 16 16">
          <path d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783"/>
        </svg>
</h4>
<!-------------------------booktexts----home------------------------------------------>


 <div class="card float-start m-2" style="width:90%"><!-- 18rem;"-->


    <h4 class="card-title">{{ t[0][0] }} </h4>
    <h5 class="card-title">{{ t[0][1] }} </h5>
     <span id="y{{ t[0][5] }}"></span>

           {% if t[0][3]==1 %}
               <audio controls>
                <source src="{{ url_for('static', filename=t[0][4]) }}" type="audio/mp3">
               </audio>
           {% else %}
              <form method="post" action="{{ url_for(request.endpoint, **request.view_args) }}?page={{ page }}#y{{ t[0][2] }}">
              {{ csrf_token }}
              <input type="hidden" name="sound" value="ok">
              <input type="hidden" name="t" value="{{ t[0][5] }}">
                  <span class="title" data-title=" Прослушать на английском ">
              <button type="submit" class="btn btn-primary m-1" >
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-volume-down" viewBox="0 0 16 16">
                  <path d="M9 4a.5.5 0 0 0-.812-.39L5.825 5.5H3.5A.5.5 0 0 0 3 6v4a.5.5 0 0 0 .5.5h2.325l2.363 1.89A.5.5 0 0 0 9 12zM6.312 6.39 8 5.04v5.92L6.312 9.61A.5.5 0 0 0 6 9.5H4v-3h2a.5.5 0 0 0 .312-.11M12.025 8a4.5 4.5 0 0 1-1.318 3.182L10 10.475A3.5 3.5 0 0 0 11.025 8 3.5 3.5 0 0 0 10 5.525l.707-.707A4.5 4.5 0 0 1 12.025 8"/>
              </svg>
              </button>
                      </span>
              </form>
           {% endif %}
  </div>
</div>


<div style="clear:both;"></div>

<!-------------------------booktexts----end------------------------------------------>
{% endblock %}
