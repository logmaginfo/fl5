<div class="container">
  <div class="row">
    <div class="col">
     {% if results[0] %}
      <h1>Треки</h1>
        {% endif %}
    </div>
    <div class="col">
     {% if results[1] %}
      <h1>Исполнители</h1>
     {% endif %}
    </div>
  </div>
</div>
<div class="container">
  <div class="row">
    <div class="col">
      {% for s in results[0] %}
        <div class="float-start">
            <a href="{{ url_for('songs.songs_name', id_name=s.id) }}" target="_blank" type="submit" class="btn btn-primary m-1" title="{{ s.group.title() }}">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-music-note-list" viewBox="0 0 16 16">
                  <path d="M12 13c0 1.105-1.12 2-2.5 2S7 14.105 7 13s1.12-2 2.5-2 2.5.895 2.5 2"></path>
                  <path fill-rule="evenodd" d="M12 3v10h-1V3z"></path>
                  <path d="M11 2.82a1 1 0 0 1 .804-.98l3-.6A1 1 0 0 1 16 2.22V4l-5 1z"></path>
                  <path fill-rule="evenodd" d="M0 11.5a.5.5 0 0 1 .5-.5H4a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5m0-4A.5.5 0 0 1 .5 7H8a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5m0-4A.5.5 0 0 1 .5 3H8a.5.5 0 0 1 0 1H.5a.5.5 0 0 1-.5-.5"></path>
                </svg>
              {{ s.name }}
            </a>
        </div>
     {% endfor %}
    </div>
    <div class="col">
           {% for s in results[1] %}
        <div class="float-start">
            <a href="{{ url_for('songs.songs_group', id_group=s.id) }}" target="_blank" type="submit" class="btn btn-primary m-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-mic" viewBox="0 0 16 16">
              <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5"></path>
              <path d="M10 8a2 2 0 1 1-4 0V3a2 2 0 1 1 4 0zM8 0a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V3a3 3 0 0 0-3-3"></path>
            </svg>
              {{ s.group.title() }}
            </a>
        </div>
     {% endfor %}
    </div>
  </div>
</div>
